<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NAVI CHARACTER</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div><p class="eyebrow">EDUCATION CHARACTER SYSTEM</p><h1>NAVI CHARACTER</h1><p class="lead">小学校向けWeb教材で使える、6人のナビゲーションキャラクター。</p></div>
    <a class="count" href="AI-GUIDE.md">AI GUIDE ↗</a>
  </header>
  <main>
    <section class="intro-card"><div><p class="section-label">CHARACTER LIBRARY</p><h2>教材に合わせて、キャラクターを選ぼう。</h2><p>画像はそのまま掲載しています。キャラクターを選ぶと、教材に貼り付けるための基本コードを確認できます。AIで使うときは、まず<a href="AI-GUIDE.md">AI向けガイド</a>を確認してください。</p></div><div class="intro-mark" aria-hidden="true">✦</div></section>
    <section class="character-grid" id="characterGrid" aria-label="キャラクター一覧"></section>
    <section class="usage-card" id="usageCard" hidden><div class="usage-preview"><img id="usageImage" alt=""></div><div class="usage-copy"><p class="section-label">USAGE</p><h2 id="usageTitle">キャラクターを選択</h2><p>管理用IDは画面には表示せず、教材側で画像を呼び出すときだけ使います。</p><div class="code-row"><code id="usageCode"></code><button id="copyButton" type="button">コードをコピー</button></div><p class="copy-status" id="copyStatus" role="status" aria-live="polite"></p></div></section>
  </main>
  <footer>TT-sensei / NAVI CHARACTER</footer>
  <script src="script.js"></script>
