name: Generate transparent character references

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Generate PNG and WebP
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np
          from collections import deque

          chars = ['kai', 'nami', 'riku', 'saku', 'sora', 'tsuki']
          base = Path('assets/characters')

          def make_transparent(src, dst_png, dst_webp):
              im = Image.open(src).convert('RGBA')
              a = np.array(im, dtype=np.uint8)
              rgb = a[:, :, :3].astype(np.int16)
              h, w = rgb.shape[:2]

              # Detect only near-white pixels connected to the image border.
              # This keeps white clothing/eyes opaque when they are enclosed by the character.
              dist = np.sqrt(np.sum((255 - rgb) ** 2, axis=2))
              bg = dist <= 42

              seen = np.zeros((h, w), dtype=bool)
              q = deque()
              for x in range(w):
                  if bg[0, x]: q.append((0, x)); seen[0, x] = True
                  if bg[h-1, x] and not seen[h-1, x]: q.append((h-1, x)); seen[h-1, x] = True
              for y in range(h):
                  if bg[y, 0] and not seen[y, 0]: q.append((y, 0)); seen[y, 0] = True
                  if bg[y, w-1] and not seen[y, w-1]: q.append((y, w-1)); seen[y, w-1] = True

              while q:
                  y, x = q.popleft()
                  for dy, dx in ((1,0),(-1,0),(0,1),(0,-1)):
                      ny, nx = y + dy, x + dx
                      if 0 <= ny < h and 0 <= nx < w and bg[ny, nx] and not seen[ny, nx]:
                          seen[ny, nx] = True
                          q.append((ny, nx))

              alpha = np.full((h, w), 255, dtype=np.uint8)
              # Smooth the anti-aliased white fringe only where background is connected.
              soft = np.clip((dist - 8) * 255 / (42 - 8), 0, 255).astype(np.uint8)
              alpha[seen] = soft[seen]

              out = a.copy()
              out[:, :, 3] = alpha
              result = Image.fromarray(out, 'RGBA')
              result.save(dst_png, 'PNG', optimize=True)
              result.save(dst_webp, 'WEBP', lossless=True, method=6)

          for c in chars:
              d = base / c
              src = d / 'reference.jpeg'
              if not src.exists():
                  raise FileNotFoundError(src)
              make_transparent(src, d / 'reference.png', d / 'reference.webp')
          PY

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/*/reference.png assets/characters/*/reference.webp
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add transparent PNG and WebP character references"
            git push
          fi
